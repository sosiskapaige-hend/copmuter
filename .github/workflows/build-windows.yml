name: Build Copmuter

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: нужна, чтобы понять, какие каталоги изменил пуш.
          fetch-depth: 0

      - name: Warn when the design is edited in the shipment-invisible web UI
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          # Дизайн приложения живёт в shell/Copmuter.Agent (WinUI). Каталог agent/ui —
          # легаси веб-интерфейс, он в ZIP не попадает: правки там никто не увидит.
          $before = '${{ github.event.before }}'
          if ($before -match '^0{40}$') { exit 0 }
          $changed = git diff --name-only $before '${{ github.sha }}'
          $web = @($changed | Where-Object { $_ -like 'agent/ui/*' })
          $shell = @($changed | Where-Object { $_ -like 'shell/*' })
          if ($web.Count -gt 0 -and $shell.Count -eq 0) {
            Write-Output "::warning title=Дизайн правится не там::В коммите изменён agent/ui/ ($($web.Count) файл(ов)) — это легаси веб-интерфейс, в ZIP он не входит. Интерфейс приложения живёт в shell/Copmuter.Agent."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (build checks only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Build C++20 Release core, host and tests
        run: |
          $log = & cmd /c native\build_windows.bat 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) {
            $log | Where-Object { $_ -match 'error|fatal|LNK[0-9]+' } | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            throw "Native build failed ($code)"
          }

      - name: Verify stop and confirmation through C ABI
        timeout-minutes: 2
        run: |
          & native/build/agent_tests.exe --abi-controls
          if ($LASTEXITCODE -ne 0) { throw 'ABI control regression tests failed' }

      - name: Verify native ABI and Python worker
        run: |
          $log = & python native/tools/check_exports.py native/build/AgentRuntime.dll native/include/agent/runtime.h 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) {
            $log | ForEach-Object { Write-Output "::error::$_" }
            throw 'Native ABI check failed'
          }
          $log = & python -m unittest discover -s ai/tests -v 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) {
            Write-Output ("::error::" + (($log | Select-Object -Last 40) -join "%0A"))
            throw 'AI worker tests failed'
          }

      - name: Test shell models and services
        run: |
          dotnet run --project shell/Copmuter.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Shell model/service tests failed' }

      - name: Publish self-contained Windows x64 app
        run: |
          $log = & dotnet publish shell/Copmuter.Agent/Copmuter.Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:Platform=x64 `
            -p:PublishSingleFile=false -p:PublishTrimmed=false -o publish 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) {
            $log | Where-Object { $_ -match 'error' } | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output ("::error title=Full publish output::" + (($log | Select-Object -Last 80) -join "%0A"))
            $paths = Get-ChildItem shell/Copmuter.Agent/obj -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Output ("::error title=Compiler files::" + ($paths -join '%0A'))
            Get-ChildItem shell/Copmuter.Agent/obj -Recurse -Filter output.json | ForEach-Object {
              $diagnostic = Get-Content $_.FullName -Raw
              Write-Output ("::error title=XAML compiler diagnostics::" + ($diagnostic -replace "`r?`n", '%0A'))
            }
            throw "Publish failed ($code)"
          }

      - name: Stamp build identity into the package
        run: |
          # В поставку входят одни и те же бинарники, поэтому без отпечатка все ZIP
          # выглядят одинаково и непонятно, какой коммит внутри. Строка состояния
          # окна показывает этот SHA.
          $info = [ordered]@{
            sha       = '${{ github.sha }}'
            ref       = '${{ github.ref_name }}'
            run       = '${{ github.run_id }}'
            event     = '${{ github.event_name }}'
            built_utc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $info | ConvertTo-Json | Set-Content publish/build-info.json -Encoding utf8
          Get-Content publish/build-info.json

      - name: Package portable runtime and smoke-test extracted ZIP
        run: |
          try { ./scripts/package-windows.ps1 }
          catch { Write-Output "::error::$_"; throw }

      - name: Upload actual WinUI screenshots and interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Copmuter-ui-check
          path: artifacts/ui-smoke/
          if-no-files-found: ignore

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Copmuter-win-x64
          path: artifacts/Copmuter-win-x64.zip
          if-no-files-found: error
