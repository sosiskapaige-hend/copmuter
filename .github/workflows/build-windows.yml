name: Build Copmuter

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (build checks only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Build C++20 Release core, host and tests
        run: |
          $log = & cmd /c native\build_windows.bat 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) {
            $log | Where-Object { $_ -match 'error|fatal|LNK[0-9]+' } | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            throw "Native build failed ($code)"
          }

      - name: Verify native ABI and Python worker
        run: |
          python native/tools/check_exports.py native/build/AgentRuntime.dll native/include/agent/runtime.h
          if ($LASTEXITCODE -ne 0) { throw 'Native ABI check failed' }
          python -m unittest discover -s ai/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'AI worker tests failed' }

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish shell/Copmuter.Agent/Copmuter.Agent.csproj
          -c Release -r win-x64 --self-contained true
          -p:WindowsAppSDKSelfContained=true -p:Platform=x64
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -o publish

      - name: Package portable runtime and smoke-test extracted ZIP
        run: ./scripts/package-windows.ps1

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Copmuter-win-x64
          path: artifacts/Copmuter-win-x64.zip
          if-no-files-found: error
